<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#74ebd5,#ACB6E5);
    height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    width:350px;
}

h1{
    color:#333;
}

h2{
    font-size:18px;
    color:#666;
}

input{
    width:80%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:5px;
    background:#4CAF50;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#222;
}

</style>

</head>

<body>

<div class="container">

<h1>GRADE CALCULATOR</h1>
<h2>ENTER THE NUMBER OF SUBJECTS</h2>

<input type="number" id="subjects" placeholder="Enter subjects">

<br><br>

<button onclick="calculateResult()">Calculate Result</button>

<div id="result"></div>

</div>

<script>function calculateResult() {

    let n = document.getElementById("subjects").value;

    let total = 0;

    for(let i = 0; i < n; i++)
    {
        let marks = parseFloat(prompt("Enter marks of subject " + (i+1)));
        total += marks;
    }

    let average = total / n;

    let grade;

    if(average >= 90)
    {
        grade = "A" + "<br>" + "CONGRATULATIONS! YOU HAVE ACHIEVED AN EXCELLENT GRADE!";
    }
    else if(average >= 80)
    {
        grade = "B" + "<br>" + "CONGRATULATIONS! YOU HAVE ACHIEVED A GOOD GRADE!";
    }
    else if(average >= 70)
    {
        grade = "C" + "<br>" + "CONGRATULATIONS! YOU HAVE ACHIEVED A SATISFACTORY GRADE! KEEP UP THE GOOD WORK!";
    }
    else if(average >= 60)
    {
        grade = "D" + "<br>" + "CONGRATULATIONS! YOU HAVE ACHIEVED A PASSING GRADE! KEEP UP THE GOOD WORK!";
    }
    else
    {
        grade = "F" + "<br>" + "CONGRATULATIONS! YOU HAVE FAILED. KEEP TRYING!";
    }

    document.getElementById("result").innerHTML =
    "Total Marks: " + total +
    "<br>Average Marks: " + average +
    "<br>Grade: " + grade;

}</script>
</body>
</html>
