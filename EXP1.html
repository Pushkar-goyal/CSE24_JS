<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
body{
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    text-align: center;
}

.container{
    width: 600px;
    margin: 100px auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.579);
    border-radius: 10px;
    box-shadow: 0px 0px 10px gray;
}

button{
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background-color: #e5951e;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    hover: background-color: #c0bd15;   
}

button:hover{
    background-color: #c0bd15;
}

input{
    padding: 8px;
    width: 250px;
    margin: 10px;
}

p{
    font-size: 16px;
}
</style>
<body>
    <div class="container">

<h2 id="heading">Welcome </h2>

<input type="text" id="textInput" placeholder="Enter new heading">

<br><br>

<button id="changeHeading">Change Heading</button>
<button id="changeBg">Change Background</button>
<button id="increaseFont">Increase Font Size</button>
<br>

<button id="togglePara">Show/Hide Paragraph</button>
<button id="reset">Reset</button>

<p id="para">
This is a sample.
</p>

</div>
</body>
<script>

let fontSize = 16 ;

document.getElementById("changeHeading").addEventListener("click", function(){
    let text = document.getElementById("textInput").value;
    document.getElementById("heading").innerText = text;
});

document.getElementById("changeBg").addEventListener("click", function(){
    document.body.style.backgroundColor =
        "#" + Math.floor(Math.random()*16777215).toString(16);
});

document.getElementById("increaseFont").addEventListener("click", function(){
    fontSize += 2;
    document.getElementById("para").style.fontSize = fontSize + "px";
});

document.getElementById("togglePara").addEventListener("click", function(){
    let p = document.getElementById("para");
    
    if(p.style.display === "none")
        p.style.display = "block";
    else
        p.style.display = "none";
});

document.getElementById("reset").addEventListener("click", function(){
    location.reload();
});

</script>

</body>
</html>
