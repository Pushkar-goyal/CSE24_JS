<!DOCTYPE html>
<html>
<head>
<title>Employee Management System</title>

<style>

body{
font-family: Arial;
background:#f4f4f4;
text-align:center;
}

.container{
width:500px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input{
width:90%;
padding:8px;
margin:5px;
}

button{
padding:10px;
margin:5px;
background:#4CAF50;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#45a049;
}

#output{
margin-top:20px;
text-align:left;
background:#eee;
padding:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>Employee Management System</h2>

<input type="text" id="name" placeholder="Employee Name"><br>
<input type="text" id="id" placeholder="Employee ID"><br>
<input type="number" id="salary" placeholder="Salary"><br>
<input type="text" id="dept" placeholder="Department"><br>

<button onclick="addEmployee()">Add Employee</button>

<hr>

<button onclick="displayEmployees()">Display All Employees</button>
<button onclick="filterSalary()">Salary > 50000</button>
<button onclick="totalSalary()">Total Salary</button>
<button onclick="averageSalary()">Average Salary</button>
<button onclick="countDepartment()">Count Department</button>

<div id="output"></div>

</div>

<script>

// array to store employee objects
let employees = [];

// function to add employee
function addEmployee(){

let name=document.getElementById("name").value;
let id=document.getElementById("id").value;
let salary=parseFloat(document.getElementById("salary").value);
let dept=document.getElementById("dept").value;

// create object
let emp={
name:name,
id:id,
salary:salary,
department:dept
};

// push object into array
employees.push(emp);

alert("Employee Added Successfully");

}

// display all employees
function displayEmployees(){

let output="";

for(let emp of employees){

output+=`Name: ${emp.name} | ID: ${emp.id} | Salary: ${emp.salary} | Dept: ${emp.department}<br>`;

}

document.getElementById("output").innerHTML=output;

}

// filter salary > 50000
function filterSalary(){

let filtered=employees.filter(emp=>emp.salary>50000);

let output="Employees with Salary > 50000<br><br>";

for(let emp of filtered){

output+=`${emp.name} - ${emp.salary}<br>`;

}

document.getElementById("output").innerHTML=output;

}

// total salary payout
function totalSalary(){

let total=0;

for(let emp of employees){
total+=emp.salary;
}

document.getElementById("output").innerHTML="Total Salary Payout: ₹"+total;

}

// average salary
function averageSalary(){

let total=0;

for(let emp of employees){
total+=emp.salary;
}

let avg=total/employees.length;

document.getElementById("output").innerHTML="Average Salary: ₹"+avg;

}

// count employees by department
function countDepartment(){

let dept=prompt("Enter Department Name");

let count=0;

for(let emp of employees){

if(emp.department.toLowerCase()==dept.toLowerCase()){
count++;
}

}

document.getElementById("output").innerHTML="Employees in "+dept+" department: "+count;

}

</script>

</body>
</html>
